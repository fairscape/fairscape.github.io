# Project Information
site_name: FAIRSCAPE
site_description: A Framework for FAIR and Reproducible Biomedical Analytics
site_url: https://fairscape.github.io/
copyright: Copyright &copy; University of Virginia
# Repository
repo_name: fairscape/fairscape.github.io
repo_url: https://github.com/fairscape/fairscape.github.io
# Configuration
theme:
  name: "material"
  navigation:
    - expand: true
    - tabs: true
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.footnote.tooltips
    - announce.dismiss
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
# Docs Navigation
nav:
  - Home: index.md
  - Components:
      - Server: components/server.md
      - CLI: components/CLI.md
      - GUI: components/GUI.md
      - Web Server: components/webserver.md
plugins:
  - search
# Extensions
markdown_extensions:
  - tables
  - toc:
      permalink: true
      title: Page contents
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      check_paths: true
      url_download: true
  - pymdownx.superfences
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.extra
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
# Customization
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fairscape
